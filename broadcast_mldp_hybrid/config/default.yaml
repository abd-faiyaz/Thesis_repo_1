model_id: broadcast_mldp_hybrid
domain: manifest_mldp_perm_receiver_actions

paths:
  apk_root: /mnt/Files/thesis_full_dataset
  # Optional shared manifest (built by Shared_pipeline_Files/tools/build_apk_manifest.py)
  shared_manifest_csv: ../Shared_pipeline_Files/data/manifests/apk_index.csv
  artifacts: artifacts
  manifests_dir: artifacts/manifests
  dataset_index: artifacts/manifests/apk_index.csv
  splits_dir: artifacts/splits
  processed: artifacts/processed
  checkpoints: artifacts/checkpoints
  metrics: artifacts/metrics
  export: artifacts/export/broadcast_mldp_hybrid
  failed_index_log: artifacts/failed_index.log
  failed_apks_log: artifacts/failed_apks.log
  system_actions_file: assets/system_actions.json

splits:
  train_years: [2020, 2021]
  holdout_years: [2022, 2023]
  # Stratified partition of holdout_years only (val + test, no overlap)
  val_fraction_of_holdout: 0.5
  random_seed: 42
  split_policy_note: >
    Train on 2020-2021 only. Val and test are a stratified split of 2022+2023
    (disjoint). MLDP vocab S and receiver vocab A are built from train only (P2).

indexing:
  label_mode: parent_folder
  benign_names: [benign, goodware, clean, good, "0"]
  malicious_names: [malware, malicious, virus, bad, "1"]
  collect_apk_metadata: true   # apk_size_bytes, num_dex_files when readable

features:
  manifest_backend: pyaxmlparser
  normalize_permission_names: true
  receiver_scope: static_manifest_only
  receiver_system_actions_only: true
  system_actions_file: assets/system_actions.json

mldp:
  method: prnr_spr_pmar
  prnr_drop_abs_threshold: 0.05
  spr_keep_top: 25
  pmar_min_support: 0.10
  pmar_min_confidence: 0.965
  target_size_hint: 22
  max_permissions: 30
  min_permissions: 8
  fallback_published_list: true

classifier:
  deployment: tiny_mlp
  tiny_mlp_hidden: 64
  paper_baseline_svm: true
  svm_C: 10.0
  svm_gamma: 0.1
  svm_kernel: rbf

training:
  batch_size: 256
  epochs: 60
  learning_rate: 0.005
  weight_decay: 0.0001
  pos_weight: auto
  early_stop_patience: 6
  seed: 42

export:
  onnx_opset: 14
  parity_num_samples: 10
  parity_max_delta: 1.0e-4

cascade:
  target_false_omission_rate: 0.02
  target_false_alarm_at_thigh: 0.02

evaluation:
  threshold: 0.5
  tune_threshold_on_val: true
