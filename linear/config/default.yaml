# LinRegDroid permission-only baseline — default configuration
# Dataset: https://huggingface.co/buckets/sakhawat2088/android-apks
# Override corpus path: APK_ROOT=/path/to/android-apks ./run_linregdroid.sh

pipeline:
  model_id: linregdroid_permission
  domain: manifest_permissions
  enabled: true
  export_offline_json: true
  export_dir: Shared_pipeline_Files/results/offline
  # Centralized indexing (optional — see Shared_pipeline_Files/tools/build_apk_manifest.py):
  use_shared_splits: false
  # shared_splits_dir: Shared_pipeline_Files/data/splits
  # shared_manifest_csv: Shared_pipeline_Files/data/manifests/apk_index.csv
  android_assets_target: vigidroid/app/src/main/assets/models/linregdroid_permission/
  # Split policy: stratified_development (not temporal_year). See preprocessing.split_mode.
  split_policy_note: >
    Train/val/dev_test from 2020-2021 (70/15/15 stratified).
    temporal_holdout (2022+2023) is the primary test split for thesis metrics (test_results.json).

paths:
  apk_root: /mnt/Files/thesis_full_dataset
  artifacts: artifacts
  processed: artifacts/processed
  checkpoints: artifacts/checkpoints
  export: artifacts/export
  dataset_index: artifacts/dataset_index.csv
  splits_dir: artifacts/splits
  failed_apks_log: artifacts/failed_apks.log
  permission_vocab: artifacts/permission_vocab.json
  latest_checkpoint: artifacts/checkpoints/linregdroid.pth

preprocessing:
  # Thesis eval protocol (intentional deviation from Pipeline_full_concept temporal_year default):
  #   development_years → train / val / dev_test (stratified 70/15/15)
  #   temporal_holdout_years → primary held-out test (reported as split=test in test_results.json)
  # val: threshold tuning only. dev_test: optional in-distribution check (--splits dev_test).
  split_mode: stratified_development
  development_years: [2020, 2021]
  train_ratio: 0.70
  val_ratio: 0.15
  dev_test_ratio: 0.15
  temporal_holdout_years: [2022, 2023]
  random_seed: 42
  label_mode: parent_folder
  benign_names: [benign, goodware, clean, good, "0"]
  malicious_names: [malware, malicious, virus, bad, "1"]
  parser: pyaxmlparser
  # Permission tokens only (no intents); names match VigiDroid ScanService.normalizePermission
  permissions_only: true
  token_normalization: vigidroid

model:
  # Primary decision rule for deployment and test_results.json:
  #   linregdroid1 — threshold on clamp(ŷ, 0, 1)  [default, mobile-friendly]
  #   linregdroid2 — nearest-class on raw ŷ (paper rule; uses paper label geometry)
  variant: linregdroid1
  fit_intercept: true
  decision_threshold: 0.5
  # Label encoding: thesis convention benign=0, malware=1 (paper uses benign=1, malware=0).
  # Training targets follow thesis labels; LinRegDroid2 maps paper geometry at inference.
  label_encoding: thesis_0_benign_1_malware
  # Paper Ensemble-1/2 (bagging, SVM, trees) intentionally out of scope — single MLR baseline.
  ensemble_scope: out_of_scope

training:
  save_sklearn: true

evaluation:
  threshold: 0.5
  metrics: [accuracy, f1, roc_auc]
  # When true, evaluation_results.json includes metrics for both LinRegDroid1 and LinRegDroid2.
  report_both_variants: true

export:
  onnx_opset: 14
  num_parity_samples: 10
  # ONNX exports clamp(ŷ,0,1) as malware_probability (not unbounded paper ŷ).
  score_output: clamped_probability
