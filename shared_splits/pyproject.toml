[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-splits"
version = "0.1.0"
description = "Unified temporal train/holdout split policy for thesis pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
]

[tool.setuptools]
package-dir = {"shared_splits" = "."}
packages = ["shared_splits"]
